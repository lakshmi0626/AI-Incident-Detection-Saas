global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "incidentiq-backend"
    metrics_path: "/api/v1/metrics/prometheus"
    static_configs:
      - targets: ["incidentiq-backend:8000"]

  - job_name: "spring-sample-app"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["sample-app:8085"]
